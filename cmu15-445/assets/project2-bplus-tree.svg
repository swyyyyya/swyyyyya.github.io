<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc"><title id="title">B+ 树结构与叶子链</title><desc id="desc">内部根节点含分隔键三十与六十，指向三个同深度叶子页。叶子分别含十与二十、三十四十五十、六十七十八十。叶子通过下一页指针有序连接。查找四十进入中间叶子，记录值为 RID。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#637351"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#30352f;font-size:18px;text-anchor:middle}.title{font-size:23px;font-weight:600}.small{font-size:16px;fill:#62695b}.label{font-size:17px;fill:#62695b}.box{fill:#fffefb;stroke:#c7ccbd;stroke-width:1.5}.green{fill:#edf2e5;stroke:#879874}.purple{fill:#eeeef6;stroke:#a4a4b9}.warm{fill:#f5eee3;stroke:#bba47c}.line{fill:none;stroke:#637351;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="460" fill="#faf9f6"/>
<text x="480" y="38" class="title">内部页负责导航，叶子页保存 key → RID</text>
<rect x="320" y="75" width="320" height="65" rx="10" class="box purple"/>
<text x="480.0" y="113.5" class="">根内部页：30  |  60</text>
<path d="M365 140L160 226" class="line"/>
<path d="M480 140V226" class="line"/>
<path d="M595 140L800 226" class="line"/>
<text x="215" y="179" class="small">key &lt; 30</text>
<text x="480" y="181" class="small">30 ≤ key &lt; 60</text>
<text x="750" y="179" class="small">key ≥ 60</text>
<rect x="30" y="226" width="260" height="92" rx="10" class="box "/>
<text x="160" y="263" class="">10  |  20</text>
<text x="160" y="294" class="small">对应 RID 数组</text>
<rect x="350" y="226" width="260" height="92" rx="10" class="box green"/>
<text x="480" y="263" class="">30  |  40  |  50</text>
<text x="480" y="294" class="small">对应 RID 数组</text>
<rect x="670" y="226" width="260" height="92" rx="10" class="box "/>
<text x="800" y="263" class="">60  |  70  |  80</text>
<text x="800" y="294" class="small">对应 RID 数组</text>
<path d="M290 275H350" class="line"/>
<path d="M610 275H670" class="line"/>
<path d="M930 275H950" class="line"/>
<text x="320" y="345" class="small">next</text>
<text x="640" y="345" class="small">next</text>
<text x="860" y="345" class="small">末页 next = INVALID</text>
<text x="480" y="393" class="label">查找 40：根的分隔键 → 中间叶子 → 对应 RID → 表页中的元组</text>
<text x="480" y="430" class="small">全部叶子深度相同；按 next 扫描可顺序读出所有有效条目（跳过墓碑）</text>
</svg>